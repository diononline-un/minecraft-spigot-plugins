name: ${project.name}
version: ${project.version}
main: me.diono.chestmanager.bukkit.ChestManagerPlugin
api-version: "1.21"
author: Diono
description: Citizens-NPC, der Truheninhalte nach Kategorien sortiert
depend: [Citizens]

permissions:
  chestmanager.admin:
    description: Sorter anlegen, entfernen, verschieben und die Konfiguration neu laden
    default: op
  chestmanager.operate:
    description: Sortierläufe auslösen, anhalten und Sperren aufheben
    default: op
  chestmanager.view:
    description: Status, Sperrliste, Selbsttest und Transportprotokoll einsehen
    default: op

commands:
  chestmanager:
    description: ChestManager verwalten
    usage: /chestmanager <create|delete|list|scan|status|sortnow|selftest|blocked|unblock|log|pause|resume|home|reload|setup>
    aliases: [cm]
